name: Actualización diaria

# Cada día, tras el cierre de Wall Street:
#  - ejecuta las órdenes pendientes al precio de apertura real,
#  - recalcula el histórico diario de patrimonio de todas las partidas,
#  - actualiza el ranking.
# Necesita el secreto SUPABASE_SECRET_KEY (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Ejecutar órdenes y recalcular históricos
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/daily-update.ts

      - name: Evitar que GitHub desactive este workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-update.yml/enable"
